<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Prokron — Project Chronicle. One project. Shared understanding.</title>
  <desc id="desc">People and AI agents exchange understanding through the same project chronicle. It connects purpose and historical decisions, current state and evidence, and the task graph of future work.</desc>
  <rect width="1200" height="600" rx="20" fill="#101d27"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <path d="M54 53h17v17H54z M79 53h17v17H79z M54 78h17v17H54z" fill="#8be0bd"/>
    <path d="M79 78h17v17H79z" fill="#efb373"/>
    <text x="114" y="86" fill="#f3f6f7" font-size="30" font-weight="700" letter-spacing="3">PROKRON</text>
    <text x="1146" y="82" text-anchor="end" fill="#aebfc9" font-size="16" letter-spacing="2">PROKRON = PROJECT CHRONICLE</text>
    <text x="54" y="164" fill="#f3f6f7" font-size="46" font-weight="700">One project. <tspan fill="#8be0bd">Shared understanding.</tspan></text>
    <text x="54" y="209" fill="#bdcbd3" font-size="24">A common language for people and AI.</text>
    <rect x="54" y="267" width="264" height="111" rx="10" fill="#192b38" stroke="#7b919f"/>
    <rect x="402" y="253" width="396" height="139" rx="10" fill="#203a36" stroke="#8be0bd"/>
    <rect x="882" y="267" width="264" height="111" rx="10" fill="#192b38" stroke="#7b919f"/>
    <path d="M321 322h77m-69-6-8 6 8 6m61-12 8 6-8 6 M802 322h77m-69-6-8 6 8 6m61-12 8 6-8 6" fill="none" stroke="#8be0bd" stroke-width="2"/>
    <text x="186" y="311" text-anchor="middle" fill="#f3f6f7" font-size="26" font-weight="700">People</text>
    <text x="186" y="344" text-anchor="middle" fill="#bdcbd3" font-size="17">Build. Review. Advise.</text>
    <text x="600" y="290" text-anchor="middle" fill="#8be0bd" font-size="13" letter-spacing="2">THE SHARED RECORD</text>
    <text x="600" y="330" text-anchor="middle" fill="#f3f6f7" font-size="29" font-weight="700">Project Chronicle</text>
    <text x="600" y="365" text-anchor="middle" fill="#bdcbd3" font-size="18">Purpose. Decisions. Work.</text>
    <text x="1014" y="311" text-anchor="middle" fill="#f3f6f7" font-size="26" font-weight="700">AI agents</text>
    <text x="1014" y="344" text-anchor="middle" fill="#bdcbd3" font-size="17">Reason. Record. Develop.</text>
    <path d="M600 392v38M230 452v-22h740v22M600 430v22" fill="none" stroke="#617c88" stroke-width="2"/>
    <g fill="#efb373">
      <circle cx="230" cy="452" r="4"/>
      <circle cx="600" cy="452" r="4"/>
      <circle cx="970" cy="452" r="4"/>
    </g>
    <g text-anchor="middle">
      <text x="230" y="482" fill="#efb373" font-size="13" letter-spacing="2">PAST / WHY THIS PATH</text>
      <text x="230" y="513" fill="#f3f6f7" font-size="20">Purpose + decision history</text>
      <text x="600" y="482" fill="#efb373" font-size="13" letter-spacing="2">PRESENT / WHERE WE ARE</text>
      <text x="600" y="513" fill="#f3f6f7" font-size="20">State + evidence</text>
      <text x="970" y="482" fill="#efb373" font-size="13" letter-spacing="2">FUTURE / WHAT COMES NEXT</text>
      <text x="970" y="513" fill="#f3f6f7" font-size="20">Task graph + next steps</text>
    </g>
    <text x="600" y="567" text-anchor="middle" fill="#aebfc9" font-size="16">Understand the project before reading the code.</text>
  </g>
</svg>
