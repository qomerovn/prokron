[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "project-prokron"
version = "0.1.1"
description = "Repository-native project continuity for humans and AI"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "TRADEMARKS.md"]

[project.scripts]
prokron = "prokron.cli:main"

[project.optional-dependencies]
dev = ["build>=1,<2", "mypy>=1,<2", "ruff>=0.6,<1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prokron = ["templates/*.md"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
